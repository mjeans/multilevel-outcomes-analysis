<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Three-level longitudinal outcomes model</title>
  <desc id="desc">Repeated measurement waves are nested within people, who are nested within organizations, with an explicit model sequence and interpretation targets.</desc>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="92" fill="#0F172A"/>
  <text x="54" y="46" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="30" font-weight="700">Multilevel Outcomes Analysis</text>
  <text x="54" y="73" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Longitudinal observations nested within people and organizations</text>
  <g font-family="Arial, sans-serif">
    <text x="54" y="137" fill="#334155" font-size="15" font-weight="700" letter-spacing="1">THREE-LEVEL DATA STRUCTURE</text>
    <rect x="54" y="158" width="640" height="444" rx="20" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
    <text x="84" y="197" fill="#075985" font-size="17" font-weight="700">LEVEL 3 · ORGANIZATIONS</text>
    <rect x="84" y="218" width="580" height="342" rx="18" fill="#DFF7F1" stroke="#5EEAD4" stroke-width="2"/>
    <text x="114" y="257" fill="#047857" font-size="17" font-weight="700">LEVEL 2 · PEOPLE</text>
    <g>
      <rect x="114" y="279" width="160" height="230" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="294" y="279" width="160" height="230" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="474" y="279" width="160" height="230" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
      <g fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle"><text x="194" y="316">Person A</text><text x="374" y="316">Person B</text><text x="554" y="316">Person C</text></g>
      <g>
        <rect x="134" y="342" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="134" y="392" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="134" y="442" width="120" height="38" rx="8" fill="#EDE9FE"/>
        <rect x="314" y="342" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="314" y="392" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="314" y="442" width="120" height="38" rx="8" fill="#EDE9FE"/>
        <rect x="494" y="342" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="494" y="392" width="120" height="38" rx="8" fill="#EDE9FE"/><rect x="494" y="442" width="120" height="38" rx="8" fill="#EDE9FE"/>
        <g fill="#5B21B6" font-size="14" font-weight="700" text-anchor="middle"><text x="194" y="367">Wave 0</text><text x="194" y="417">Wave 1</text><text x="194" y="467">Wave 2</text><text x="374" y="367">Wave 0</text><text x="374" y="417">Wave 1</text><text x="374" y="467">Wave 2</text><text x="554" y="367">Wave 0</text><text x="554" y="417">Wave 1</text><text x="554" y="467">Wave 2</text></g>
      </g>
    </g>

    <rect x="724" y="158" width="422" height="444" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="756" y="200" fill="#0F172A" font-size="21" font-weight="700">Model sequence</text>
    <g>
      <rect x="756" y="224" width="358" height="72" rx="12" fill="#E0F2FE"/>
      <rect x="756" y="312" width="358" height="94" rx="12" fill="#DFF7F1"/>
      <rect x="756" y="422" width="358" height="104" rx="12" fill="#FEF3C7"/>
      <text x="780" y="253" fill="#075985" font-size="16" font-weight="700">1 · Partition variance</text>
      <text x="780" y="277" fill="#475569" font-size="14">Organizations · people · observations</text>
      <text x="780" y="341" fill="#047857" font-size="16" font-weight="700">2 · Add fixed effects</text>
      <text x="780" y="365" fill="#475569" font-size="14">Time · program · baseline score</text>
      <text x="780" y="387" fill="#475569" font-size="14">Socioeconomic and language factors</text>
      <text x="780" y="451" fill="#92400E" font-size="16" font-weight="700">3 · Estimate differential growth</text>
      <text x="780" y="475" fill="#475569" font-size="14">Time × program interaction</text>
      <text x="780" y="497" fill="#475569" font-size="14">Organization random time slope</text>
    </g>
    <rect x="756" y="548" width="358" height="31" rx="8" fill="#0F172A"/>
    <text x="935" y="569" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Diagnostics precede interpretation</text>
  </g>
</svg>
